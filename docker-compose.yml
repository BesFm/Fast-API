version: '3.9-slim'
services:
  service_a:
    env_file: .env
    build:
      context: .
      dockerfile: service_a/Dockerfile
    container_name: service_a
    ports:
      - "${SERVICE_A_PORT}:${COMMON_PORT}"
    command: uvicorn service_a.main:app --host 0.0.0.0 --reload
  service_b:
    env_file: .env
    build:
      context: .
      dockerfile: service_b/Dockerfile
    container_name: service_b
    ports:
      - "${SERVICE_B_PORT}:${COMMON_PORT}"
    depends_on:
      - service_a
    command: uvicorn service_b.main:app --host 0.0.0.0 --reload
  service_c:
    env_file: .env
    build:
      context: .
      dockerfile: service_c/Dockerfile
    container_name: service_c
    ports:
      - "${SERVICE_C_PORT}:${COMMON_PORT}"
    depends_on:
      - service_b
    command: uvicorn service_c.main:app --host 0.0.0.0 --reload